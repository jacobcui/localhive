[project]
name = "run-models"
version = "0.1.0"
description = "Helper for running llama models"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.3.0",
    "uvicorn>=0.23.0",
    "fastapi>=0.100.0",
    "sse-starlette>=1.6.0",
    "starlette-context>=0.3.0",
    "anyio>=4.0.0",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
