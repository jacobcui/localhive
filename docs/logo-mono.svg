<!--
  localhive mark
  A hexagonal memory budget filled with the models that fit it.

  Geometry: pointy-top honeycomb. A 7-cell flower (1 centre + 6 ring) sits
  inside a larger hexagon. The cell radius is 0.333 x the outer radius, which
  is the largest flower that still fits within the outer hexagon's apothem,
  so the honeycomb never crowds the border.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-128 -128 256 256" width="512" height="512" role="img" aria-label="localhive">
  <!-- Single colour: inherits currentColor, cells knocked out via a mask. -->
  <mask id="cut">
    <rect x="-128" y="-128" width="256" height="256" fill="#fff"/>
    <polygon points="0.00,-25.77 22.32,-12.89 22.32,12.89 0.00,25.77 -22.32,12.89 -22.32,-12.89" fill="#000"/>
    <polygon points="49.60,-25.77 71.92,-12.89 71.92,12.89 49.60,25.77 27.28,12.89 27.28,-12.89" fill="#000"/>
    <polygon points="24.80,-68.73 47.12,-55.84 47.12,-30.07 24.80,-17.18 2.48,-30.07 2.48,-55.84" fill="#000"/>
    <polygon points="-24.80,-68.73 -2.48,-55.84 -2.48,-30.07 -24.80,-17.18 -47.12,-30.07 -47.12,-55.84" fill="#000"/>
    <polygon points="-49.60,-25.77 -27.28,-12.89 -27.28,12.89 -49.60,25.77 -71.92,12.89 -71.92,-12.89" fill="#000"/>
    <polygon points="-24.80,17.18 -2.48,30.07 -2.48,55.84 -24.80,68.73 -47.12,55.84 -47.12,30.07" fill="#000"/>
    <polygon points="24.80,17.18 47.12,30.07 47.12,55.84 24.80,68.73 2.48,55.84 2.48,30.07" fill="#000"/>
  </mask>
  <polygon points="0.00,-100.00 86.60,-50.00 86.60,50.00 0.00,100.00 -86.60,50.00 -86.60,-50.00" fill="currentColor" mask="url(#cut)"/>
</svg>
