  <polygon points="-24.80,17.18 -2.48,30.07 -2.48,55.84 -24.80,68.73 -47.12,55.84 -47.12,30.07" fill="url(#honey)"/>
  <polygon points="24.80,17.18 47.12,30.07 47.12,55.84 24.80,68.73 2.48,55.84 2.48,30.07" fill="url(#honey)"/>
