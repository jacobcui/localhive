<!--
  localhive mark
  A hexagonal memory budget filled with the models that fit it.

  Geometry: pointy-top honeycomb. A 7-cell flower (1 centre + 6 ring) sits
  inside a larger hexagon. The cell radius is 0.333 x the outer radius, which
  is the largest flower that still fits within the outer hexagon's apothem,
  so the honeycomb never crowds the border.
-->
